[workspace]
resolver = "2"
members = ["roamling-core", "roamling-agent", "roamling-pet", "roamling-update", "roamling-win", "roamling-android"]
# `roamling-win` is left out of the default set on purpose: it depends on the
# `windows` crate, so a bare `cargo test` on macOS would try to build Win32
# bindings and fail. `scripts/test.sh` runs that bare form. Build the shell
# explicitly instead:  cargo build -p roamling-win
default-members = ["roamling-core", "roamling-agent", "roamling-pet", "roamling-update", "roamling-android"]

[workspace.package]
version = "0.6.6"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
lto = true
codegen-units = 1
