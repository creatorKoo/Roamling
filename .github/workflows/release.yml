#
# Cuts a release when a `v*` tag is pushed.
#
# Three secrets:
#
#   ROAMLING_UPDATE_SECRET_KEY  the Ed25519 key whose public half is compiled
#                               into both apps. Without it a release can still
#                               be built, but nothing already installed will
#                               accept it -- see docs/windows.md, W7.
#   MACOS_CERT_P12              the signing certificate, base64 of a .p12.
#   MACOS_CERT_PASSWORD         its password.
#
# The macOS certificate is self-signed rather than a Developer ID, which is a
# decision with a cost attached: a first download is blocked until the user
# goes to System Settings and says to open it anyway. What it buys is the thing
# that matters more, which is that the designated requirement stays pinned to
# the certificate instead of the binary's hash -- so an update is the same app
# to macOS and the user keeps the permissions they granted.
#
# The two builds run in parallel and a third job signs one appcast covering
# both. It has to be one: the manifest is signed as a whole, so two jobs each
# writing their own would leave whichever published last as the only feed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The binary reports its own version from Cargo.toml. If the tag says
          # something else, the appcast offers a version the installed build
          # will never believe it has reached -- and it updates on every check,
          # forever. Cheaper to fail here.
          declared=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          if [ "$declared" != "$version" ]; then
            echo "tag says $version but rust/Cargo.toml says $declared" >&2
            exit 1
          fi

      - name: Test
        shell: bash
        working-directory: rust
        run: |
          cargo test --release
          cargo test -p roamling-win

      - name: Build
        working-directory: rust
        run: cargo build -p roamling-win --release

      - name: Package
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            winget install --id JRSoftware.InnoSetup --silent `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\roamling.iss

      # Staged flat first. `upload-artifact` keeps whatever directory the
      # listed paths have in common, so uploading them where they were built
      # would put the exe under `rust/target/release/` in the artifact and the
      # publish job would not find it where it looks.
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp rust/target/release/roamling.exe dist/
          cp build/Roamling-Setup.exe dist/

      - name: Hand the build on
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/swift-toolchain

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Both files have to agree with the tag. `rust/Cargo.toml` is what
          # the updater compares against, and `Support/Info.plist` is what the
          # About box shows; either one drifting is a bug a user sees.
          declared=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          plist=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            Support/Info.plist)
          if [ "$declared" != "$version" ] || [ "$plist" != "$version" ]; then
            echo "tag says $version, Cargo.toml says $declared, Info.plist says $plist" >&2
            exit 1
          fi

      - uses: ./.github/actions/signing-identity
        with:
          p12: ${{ secrets.MACOS_CERT_P12 }}
          password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Test
        run: ./scripts/test.sh

      - name: Build
        env:
          ROAMLING_CODESIGN_IDENTITY: Roamling
        run: ./scripts/build-app.sh release

      - name: Package
        run: ./scripts/build-dmg.sh "${{ steps.version.outputs.version }}"

      # A well-formed, correctly signed bundle can still be one that cannot
      # start. 0.3.0 was exactly that: SwiftPM compiles an absolute path to this
      # checkout's build directory into the resource lookup, so a binary finds
      # its resources on the machine that built it and nowhere else. Renaming
      # the build directory is what makes this runner stand in for a user's.
      #
      # The zip, because that is the copy the updater installs -- the one that
      # reaches a machine without asking anybody first.
      - name: Start it the way a user would
        run: |
          set -e
          ditto -x -k "build/Roamling-${{ steps.version.outputs.version }}.zip" \
            "$RUNNER_TEMP/launch"
          mv .build .build-hidden
          trap 'mv .build-hidden .build' EXIT
          ROAMLING_SMOKE_TEST=1 "$RUNNER_TEMP/launch/Roamling.app/Contents/MacOS/Roamling" \
            2>&1 | tee "$RUNNER_TEMP/smoke.log"
          # A pipeline exits with `tee`'s status, so a crash on the left would
          # pass unnoticed. The line the smoke path prints once the app is fully
          # up is the thing worth checking, so check that.
          grep -q '^smoke.localization=' "$RUNNER_TEMP/smoke.log"
          echo "it launched, drew its menu bar item, and shut down cleanly"

      # Both are already in `build/`, which is the directory they have in
      # common, so they arrive at the top of the artifact.
      - name: Hand the build on
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/Roamling-${{ steps.version.outputs.version }}.dmg
            build/Roamling-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Sign the release
        env:
          ROAMLING_UPDATE_SECRET_KEY: ${{ secrets.ROAMLING_UPDATE_SECRET_KEY }}
        run: |
          if [ -z "$ROAMLING_UPDATE_SECRET_KEY" ]; then
            echo "::error::ROAMLING_UPDATE_SECRET_KEY is not set; nothing already installed could accept this release"
            exit 1
          fi
          version="${{ steps.version.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          # The URL is the tagged one, not `latest`: the feed says which build it
          # is describing, and `latest` would drift out from under the signature.
          #
          # macOS updates from the zip rather than the dmg. Replacing a running
          # app out of a disk image means a mount point and an unmount that can
          # fail with the volume busy; a zip is bytes in and a bundle out.
          #
          # arm64 only, on purpose. Intel Macs are not a target: covering them
          # means a universal build -- both Rust targets, both Swift slices and
          # `lipo` over the result -- for machines Apple stopped selling in
          # 2023. An Intel Mac finds no entry here and is told it is up to date
          # rather than handed something it cannot run, which is the right
          # answer for a platform we do not ship to.
          cargo run --manifest-path rust/Cargo.toml -q -p roamling-update \
            --bin roamling-appcast -- sign "$version" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${version}" \
            "windows-x86_64=${base}/roamling.exe=artifacts/roamling.exe" \
            "macos-arm64=${base}/Roamling-${version}.zip=artifacts/Roamling-${version}.zip"
          cat appcast.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v${version}" \
            --title "Roamling ${version}" \
            --generate-notes \
            artifacts/roamling.exe \
            artifacts/Roamling-Setup.exe \
            "artifacts/Roamling-${version}.dmg" \
            "artifacts/Roamling-${version}.zip" \
            appcast.json \
            appcast.json.sig
