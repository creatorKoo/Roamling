[package]
name = "roamling-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows shell: window, tray, input, and the tick loop around the core."

[dependencies]
# Linked directly, not through uniffi -- Rust calling Rust, so this side pays
# no FFI at all. See docs/windows.md, "양 플랫폼이 붙는 방식이 다르다".
roamling-core = { path = "../roamling-core" }
roamling-pet = { path = "../roamling-pet" }
roamling-agent = { path = "../roamling-agent" }
roamling-update = { path = "../roamling-update" }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Shell",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_Networking_WinHttp",
]

[[bin]]
name = "roamling"
path = "src/main.rs"
