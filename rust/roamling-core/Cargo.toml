[package]
name = "roamling-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent geometry, world, behavior, attention and reaction."

[lib]
# cdylib for the macOS app to load, rlib so the Windows shell can link it
# directly -- that side pays no FFI at all.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
