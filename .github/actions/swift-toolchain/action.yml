name: Pick a Swift toolchain
description: >
  Selects the newest installed Xcode whose Swift can build Package.swift, and
  says which one it picked.

# The runner's default Xcode is whatever the image maintainers chose, and it
# has been behind us: macos-14 tops out at Swift 6.0 and the package asks for
# 6.2, so a release died at `package is using Swift tools version 6.2.0 but the
# installed version is 5.10.0` -- eleven characters of which are the actual
# problem.
#
# Pinning a version would fix it until the image drops that version, which the
# images do. So this reads what the package asks for, takes the newest Xcode
# that can answer, and prints both. When none can, it prints every Xcode it
# found and what each one has, which is the list you need to choose a runner.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        needed="$(sed -n 's|^// *swift-tools-version: *\([0-9][0-9.]*\).*|\1|p' Package.swift)"
        if [ -z "$needed" ]; then
          echo "::error::no swift-tools-version line in Package.swift"
          exit 1
        fi
        echo "Package.swift asks for Swift $needed"

        echo "the runner's default is $(xcode-select -p)"
        swift --version 2>&1 | sed 's/^/  /' || true

        # macOS ships bash 3.2, which is what a composite action's `bash` is,
        # so no arrays with holes, no readarray, no ${a[@]} tricks. The paths
        # the images use have no spaces in them.
        shopt -s nullglob
        if [ -z "$(echo /Applications/Xcode*.app)" ]; then
          echo "::error::no /Applications/Xcode*.app on this runner. /Applications holds:"
          ls -1 /Applications | sed 's/^/  /'
          exit 1
        fi

        # Newest first, so the first one that can build is the one we take.
        for app in $(printf '%s\n' /Applications/Xcode*.app | sort -Vr); do
          # Asked through xcrun rather than by path. swift is not in
          # Contents/Developer/usr/bin -- it lives in the toolchain under it,
          # whose directory name is Xcode's business and not ours. Looking for
          # it by hand reported every Xcode on the runner, 26.3 included, as
          # having no Swift at all.
          have="$(DEVELOPER_DIR="$app/Contents/Developer" /usr/bin/xcrun swift --version 2>&1 |
            sed -n 's/.*Apple Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          if [ -z "$have" ]; then
            echo "  $app -- would not say its version"
            continue
          fi
          echo "  $app -- Swift $have"
          # sort -V puts the lower one first, so if what we need sorts first,
          # what this Xcode has is at least as new.
          if [ "$(printf '%s\n%s\n' "$needed" "$have" | sort -V | head -1)" = "$needed" ]; then
            sudo xcode-select -s "$app/Contents/Developer"
            echo "using $app (Swift $have)"
            exit 0
          fi
        done

        echo "::error::none of the Xcodes listed above has Swift $needed."
        echo "Newer toolchains come with newer images -- try a later runs-on."
        exit 1
