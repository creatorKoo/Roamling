#
# Everything the release's macOS job does, except publish.
#
# The release workflow was the only place any of this ran, so the only way to
# test a change was to cut a release -- and the first attempt stopped at `MAC
# verification failed during PKCS12 import`, eleven minutes in, on a run whose
# Windows half had already finished.
#
# So: the certificate, then the tests, then the build, then the packaging, and
# a look at what came out. Nothing is uploaded and no tag is touched.
#
# Nothing secret is printed. The certificate's name is, because a certificate's
# subject is public by definition -- it is in every signature it has ever made.

name: Check macOS

on: workflow_dispatch

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check the certificate and its password
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set +e
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::error::MACOS_CERT_P12 is not set"
            exit 1
          fi

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          if [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "::error::MACOS_CERT_P12 did not decode to anything. Re-upload with:"
            echo "  base64 -i cert.p12 | gh secret set MACOS_CERT_P12"
            exit 1
          fi
          echo "decoded $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') bytes"

          # Structure first, which needs no password. If this fails the upload
          # is damaged and the password is not the problem.
          openssl asn1parse -inform DER -in "$RUNNER_TEMP/cert.p12" -noout 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "::error::the decoded bytes are not a PKCS#12 file -- the upload is damaged, not the password"
            exit 1
          fi
          echo "structure reads as PKCS#12"

          # Then the password, by itself, before the keychain is involved. This
          # separates "wrong password" from "keychain would not take it".
          #
          # Both ways, because the format matters here more than anywhere else.
          # Keychain Access writes the old PKCS#12 encryption, which OpenSSL 3
          # moved behind `-legacy` -- and that old format is the *only* one
          # `security import` accepts. So a file that needs `-legacy` is the
          # right file, and one that does not is the one that will fail below.
          if openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" \
              -passin env:MACOS_CERT_PASSWORD -noout -legacy 2>/dev/null; then
            echo "password opens the file (legacy encryption, which is what security import wants)"
          elif openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" \
              -passin env:MACOS_CERT_PASSWORD -noout 2>/dev/null; then
            echo "::warning::password opens the file, but it is not the legacy encryption"
            echo "::warning::security import only reads what Keychain Access writes; expect it to refuse this"
          else
            echo "::error::MACOS_CERT_PASSWORD does not open MACOS_CERT_P12."
            echo "Check it locally against the same file:"
            echo "  openssl pkcs12 -in roamling-secure.p12 -noout"
            echo "and set it again, letting gh prompt so no newline is added:"
            echo "  gh secret set MACOS_CERT_PASSWORD"
            rm -f "$RUNNER_TEMP/cert.p12"
            exit 1
          fi

          keychain="$RUNNER_TEMP/check.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          # Long enough to outlast the build below. The default relocks, and a
          # locked keychain fails the sign three steps later with an error that
          # says nothing about locking.
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          status=$?
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ $status -ne 0 ]; then
            echo "::error::the password is right but the keychain refused the file."
            echo "Measured on macos-14: of the ways OpenSSL can write a PKCS#12,"
            echo "only the legacy one imports -- not the default, not AES with a"
            echo "SHA-1 MAC. Re-export from Keychain Access, which writes exactly"
            echo "that, and give it a long password: the old format's weakness is"
            echo "a weak KDF, and a long password is the answer to that rather"
            echo "than a container security cannot read."
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          echo "imported"

          # Then the only question that matters: can codesign sign with it.
          #
          # Not `find-identity -v`, which was here first and lied. That filters
          # on *trust*, and a self-signed certificate is not trusted on a fresh
          # runner -- so it reports "0 valid identities found" about a
          # certificate that signs perfectly well. Measured: codesign does not
          # need trust to sign, only to verify.
          cp /bin/echo "$RUNNER_TEMP/victim"
          codesign --force --sign "Roamling" --keychain "$keychain" "$RUNNER_TEMP/victim"
          if [ $? -ne 0 ]; then
            echo "::error::the certificate imported but codesign will not use it"
            exit 1
          fi
          requirement="$(codesign -d -r- "$RUNNER_TEMP/victim" 2>&1 |
            sed -n 's/^#* *designated => //p')"
          echo "signed a throwaway file, and it came out as:"
          echo "  $requirement"
          # Certificate-based, not a cdhash. That is the whole point of signing
          # with an identity: an update stays the same app to macOS and the user
          # keeps the permissions they granted.
          case "$requirement" in
            *"certificate leaf"*) echo "pinned to the certificate -- this is what a release needs" ;;
            *) echo "::error::signed ad-hoc, which would reset the user's permissions on every update"; exit 1 ;;
          esac
          # Left in the search list for the steps below, which are the release's
          # own and must find the identity the same way.
          echo "keychain=$keychain" >> "$GITHUB_ENV"

      - name: Test
        run: ./scripts/test.sh

      - name: Build
        env:
          ROAMLING_CODESIGN_IDENTITY: Roamling
        run: ./scripts/build-app.sh release

      - name: Package
        run: ./scripts/build-dmg.sh "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"

      - name: Look at what came out
        run: |
          set -e
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          ls -lh "build/Roamling-$version.dmg" "build/Roamling-$version.zip"

          # The dmg is what a person installs, so it is checked the way a person
          # opens it: mounted and dragged out. What is asked of the copy is that
          # its seal survived the round trip -- hdiutil stamps the bundle with a
          # Finder attribute on the way in, which broke the signature until
          # build-dmg.sh started stripping it inside the mounted image.
          #
          # Not spctl. A self-signed certificate is not one Gatekeeper knows, so
          # the first launch needs right-click -> Open however well this signs.
          # That is the cost of not paying Apple, and it is separate from the
          # thing being tested here.
          hdiutil attach "build/Roamling-$version.dmg" -readonly -nobrowse -mountpoint /tmp/dmg
          test -L /tmp/dmg/Applications
          cp -R /tmp/dmg/Roamling.app "$RUNNER_TEMP/dragged.app"
          hdiutil detach /tmp/dmg -quiet
          codesign --verify --deep --strict "$RUNNER_TEMP/dragged.app"
          codesign -d -r- "$RUNNER_TEMP/dragged.app" 2>&1 |
            sed -n 's/^#* *designated => /dragged out of the dmg: /p'

          # And the zip, which is what the updater unpacks.
          ditto -x -k "build/Roamling-$version.zip" "$RUNNER_TEMP/unzipped"
          codesign --verify --deep --strict "$RUNNER_TEMP/unzipped/Roamling.app"
          echo "the zip the updater would install verifies too"
