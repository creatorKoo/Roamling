[package]
name = "roamling-pet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sprite sheets as bytes: decoding, the built-in mascot, and frame lookup."

[dependencies]
roamling-core = { path = "../roamling-core" }
# W2b's decoder. This is what option D buys over vendoring libwebp: WebP and
# PNG arrive together, cross-platform, with no C in the tree.
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
# Pet packages are JSON. Same crate the agent adapters read hook payloads with.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
