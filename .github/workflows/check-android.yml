name: Check Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - rust/**
      - Sources/RoamlingPet/Resources/**
      - scripts/build-android-core.*
      - .gitattributes
      - .github/workflows/check-android.yml
  pull_request:
    paths:
      - android/**
      - rust/**
      - Sources/RoamlingPet/Resources/**
      - scripts/build-android-core.*
      - .gitattributes
      - .github/workflows/check-android.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Android toolchain
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.1' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Rust and Kotlin bindings
        run: bash scripts/build-android-core.sh
      - name: Debug APK and Android lint
        run: bash android/gradlew -p android :app:assembleDebug :app:lintDebug --no-daemon
      - name: Native 16 KB alignment
        shell: bash
        run: |
          reader="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          native_dir=$(mktemp -d)
          unzip -q "$apk" 'lib/*/*.so' -d "$native_dir"
          test "$(find "$native_dir/lib" -name '*.so' | wc -l)" -eq 4
          for library in "$native_dir"/lib/*/*.so; do
            "$reader" -lW "$library" |
              awk '/LOAD/ { count++; if ($NF != "0x4000") bad=1 } END { exit (count == 0 || bad) }'
          done
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$apk"
