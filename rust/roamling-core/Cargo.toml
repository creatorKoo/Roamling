[package]
name = "roamling-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent geometry, world, behavior, attention and reaction."

[lib]
# cdylib for the macOS app to load, rlib so the Windows shell can link it
# directly -- that side pays no FFI at all.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
# The update decisions -- is it newer, is it ours -- are shared with Windows.
# They come in through here because this is the crate the macOS app already
# links, and a second uniffi surface would mean a second set of bindings for
# four functions.
roamling-update = { path = "../roamling-update" }
# W2b's decoder. WebP and PNG arrive together, cross-platform, with no C in the
# tree -- which is what option D bought over vendoring libwebp. It is here
# rather than in `roamling-pet` because the macOS shell needs to decode too and
# this is the crate it already links; `roamling-pet` depends on this one.
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
